# Roda o bot automaticamente na nuvem do GitHub.
# Seu MacBook pode ficar desligado.

name: Monitor CSSDeals

on:
  schedule:
    # A cada 15 minutos.
    #
    # POR QUE NAO 5 MINUTOS: o GitHub trata agendamentos muito frequentes
    # como baixa prioridade e simplesmente os descarta sob carga. Com
    # '*/5' este bot passou 20 horas sem disparar NENHUMA vez. Intervalos
    # maiores sao bem mais confiaveis — 15 minutos que acontecem valem
    # mais que 5 minutos que nunca acontecem.
    #
    # Nao ha perda de produtos: o bot le os 50 mais recentes, o que cobre
    # ~6 horas de publicacoes do site.
    - cron: '*/15 * * * *'

  # Permite rodar na mao pelo site do GitHub, sem esperar o agendamento
  workflow_dispatch:

# Impede duas rodadas ao mesmo tempo (evitaria mensagem duplicada).
# O nome tem sufixo porque uma rodada travou numa queda do GitHub em
# 26/08/2026 e ficou presa na fila para sempre, bloqueando as demais.
# Trocar o nome do grupo e a unica forma de escapar de uma rodada zumbi.
concurrency:
  group: monitor-cssdeals-v2
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest

    # Se uma rodada travar, ela morre em 10 minutos em vez de ficar
    # presa e bloquear todas as proximas.
    timeout-minutes: 10

    # Necessario para o bot salvar a memoria (vistos.txt) de volta
    permissions:
      contents: write

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet -r requirements.txt

      - name: Rodar o bot
        env:
          # Vem do cofre de senhas do GitHub (Settings > Secrets)
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Modo hospedado: memoria em arquivo de texto
          ARQUIVO_ESTADO: vistos.txt
          TRADUZIR: 'sim'
          TRADUCAO_EMAIL: ${{ secrets.TRADUCAO_EMAIL }}
          CATEGORIA_ID: ${{ vars.CATEGORIA_ID }}
        run: python bot.py

      - name: Guardar a memoria para a proxima rodada
        run: |
          git config user.name  "monitor-cssdeals"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 'git add' cobre tanto arquivo novo quanto alterado.
          # (Nao use 'git diff' antes do add: arquivo ainda nao rastreado
          #  aparece como "sem mudancas" e o primeiro salvamento se perde.)
          git add vistos.txt 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Nenhum produto novo — nada a salvar."
            exit 0
          fi

          git commit -m "memoria: $(date -u '+%d/%m/%Y %H:%M UTC')"

          # Tenta ate 3 vezes: outra rodada pode ter salvado no meio
          for tentativa in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Conflito ao salvar (tentativa $tentativa). Tentando de novo..."
            sleep 5
          done
          echo "Nao consegui salvar a memoria. A proxima rodada corrige."
